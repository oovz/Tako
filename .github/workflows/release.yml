name: Release

# Triggered by tag pushes (v*) and manual dispatch. Calls the same reusable
# quality-e2e.yml workflow used by ci.yml so a release is gated by the exact
# same build/lint/test/E2E verification as branch CI, without re-triggering
# ci.yml itself (which would duplicate runs when main and a tag are pushed
# together).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      checkout_sha: ${{ steps.resolve.outputs.checkout_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Resolve release tag to an immutable commit
        id: resolve
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -cnotmatch '^v.+') {
            throw "Release tag must start with v. Got: $tag"
          }

          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag does not exist: $tag"
          }

          $checkoutSha = (git rev-list -n 1 "refs/tags/$tag").Trim()
          if ([string]::IsNullOrWhiteSpace($checkoutSha)) {
            throw "Could not resolve release tag to a commit: $tag"
          }
          if ($env:EVENT_NAME -ceq 'push' -and $checkoutSha -cne $env:EVENT_SHA) {
            throw "Tag push SHA does not match resolved tag. Event: $($env:EVENT_SHA); resolved: $checkoutSha"
          }

          @(
            "checkout_sha=$checkoutSha"
            "release_tag=$tag"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  verify:
    needs: resolve
    uses: ./.github/workflows/quality-e2e.yml
    with:
      checkout_ref: ${{ needs.resolve.outputs.checkout_sha }}

  release:
    needs:
      - resolve
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.checkout_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.checkout_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Validate release tag
        shell: pwsh
        run: |
          $resolvedTagSha = (git rev-list -n 1 "refs/tags/$env:RELEASE_TAG").Trim()
          if ($resolvedTagSha -cne $env:RELEASE_SHA) {
            throw "Release tag moved after resolution. Expected: $($env:RELEASE_SHA); got: $resolvedTagSha"
          }

          $packageVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag must match package.json exactly. Expected: $expectedTag; got: $env:RELEASE_TAG"
          }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build release bundle
        run: pnpm zip
        env:
          E2E_COVERAGE: "false"
          TMD_TEST_E2E_USE_MOCKS: "false"
      - name: Validate packaged manifest version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $manifestPath = '.output/chrome-mv3/manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Packaged manifest not found at $manifestPath"
          }

          $manifestVersion = (Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json).version
          if ($manifestVersion -cne $packageVersion) {
            throw "Packaged manifest version must match package.json. Package: $packageVersion; manifest: $manifestVersion"
          }
      - name: Prepare release asset and commit notes
        id: prepare_release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $zipAsset = Get-ChildItem '.output' -Filter '*-chrome.zip' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $zipAsset) {
            throw 'Could not find the packaged Chrome zip in .output after running pnpm zip.'
          }

          $releaseAssetName = "tako-manga-downloader-$tag-chrome.zip"
          $releaseAssetPath = Join-Path $assetDir $releaseAssetName
          Copy-Item $zipAsset.FullName $releaseAssetPath

          $releaseCommit = (git rev-list -n 1 $tag).Trim()
          $previousTag = ''
          try {
            $previousTag = (git describe --tags --abbrev=0 "$releaseCommit^" --match 'v*' 2>$null).Trim()
          } catch {
            $previousTag = ''
          }

          $commitLog = if ($previousTag) {
            git log --pretty=format:'- %h %s (%an)' "$previousTag..$tag"
          } else {
            git log --pretty=format:'- %h %s (%an)' -n 20 $tag
          }

          if ([string]::IsNullOrWhiteSpace(($commitLog | Out-String))) {
            $commitLog = '- No commits found for this release range.'
          }

          $commitLogPath = Join-Path $env:RUNNER_TEMP 'recent-commits.md'
          $commitLog | Set-Content -Path $commitLogPath -Encoding utf8

          @(
            "asset_path=$releaseAssetPath"
            "asset_name=$releaseAssetName"
            "commit_log_path=$commitLogPath"
            "previous_tag=$previousTag"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Publish GitHub release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TAG_NAME: ${{ env.RELEASE_TAG }}
          RELEASE_ASSET_PATH: ${{ steps.prepare_release.outputs.asset_path }}
          RELEASE_ASSET_NAME: ${{ steps.prepare_release.outputs.asset_name }}
          COMMIT_LOG_PATH: ${{ steps.prepare_release.outputs.commit_log_path }}
          PREVIOUS_TAG: ${{ steps.prepare_release.outputs.previous_tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const previousTag = process.env.PREVIOUS_TAG || '';
            const assetPath = process.env.RELEASE_ASSET_PATH;
            const assetName = process.env.RELEASE_ASSET_NAME;
            const commitLog = fs.readFileSync(process.env.COMMIT_LOG_PATH, 'utf8').trim();

            const generatedNotes = await github.request('POST /repos/{owner}/{repo}/releases/generate-notes', {
              owner,
              repo,
              tag_name: tag,
              ...(previousTag ? { previous_tag_name: previousTag } : {}),
            });

            const releaseName = generatedNotes.data.name || `Tako ${tag}`;
            const bodySections = [
              '## Recent commits',
              previousTag ? `_Changes since ${previousTag}._` : '_Latest commits included in this release._',
              '',
              commitLog || '- No commits found in this release range.',
            ];

            if (generatedNotes.data.body?.trim()) {
              bodySections.push('', '---', '', generatedNotes.data.body.trim());
            }

            const releaseBody = bodySections.join('\n');

            const releases = await github.paginate('GET /repos/{owner}/{repo}/releases', {
              owner,
              repo,
              per_page: 100,
            });
            let release = releases.find((candidate) => candidate.tag_name === tag);
            const isNewRelease = !release;

            if (isNewRelease) {
              release = (
                await github.request('POST /repos/{owner}/{repo}/releases', {
                  owner,
                  repo,
                  tag_name: tag,
                  name: releaseName,
                  body: releaseBody,
                  draft: true,
                  prerelease: false,
                })
              ).data;
            }

            const existingAssets = await github.paginate('GET /repos/{owner}/{repo}/releases/{release_id}/assets', {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });

            const assetData = fs.readFileSync(assetPath);
            const stagedAssetName = isNewRelease
              ? assetName
              : `${assetName}.staged-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const uploadUrl = release.upload_url.replace(
              '{?name,label}',
              `?name=${encodeURIComponent(stagedAssetName)}`,
            );

            const uploadedAsset = (
              await github.request({
                method: 'POST',
                url: uploadUrl,
                headers: {
                  'content-type': 'application/zip',
                  'content-length': String(assetData.length),
                },
                data: assetData,
              })
            ).data;

            if (!isNewRelease) {
              for (const asset of existingAssets) {
                if (asset.name === assetName) {
                  await github.request('DELETE /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                    owner,
                    repo,
                    asset_id: asset.id,
                  });
                }
              }

              await github.request('PATCH /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner,
                repo,
                asset_id: uploadedAsset.id,
                name: assetName,
              });
            }

            await github.request('PATCH /repos/{owner}/{repo}/releases/{release_id}', {
              owner,
              repo,
              release_id: release.id,
              name: releaseName,
              body: releaseBody,
              draft: false,
              prerelease: false,
            });
