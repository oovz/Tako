name: Quality and E2E

# Shared build, static analysis, coverage, and deterministic browser checks.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or SHA that every verification job must check out
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format check
        run: pnpm format:check
      - name: Verify generated site-integration registries are current
        run: pnpm check:site-integrations
      - name: Check architecture boundaries
        run: pnpm check:architecture
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit and integration tests with coverage check
        run: pnpm test:coverage
      - name: Browser-compatible runtime coverage check
        run: pnpm test:coverage:runtime
      - name: Build
        run: pnpm build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # Match cached browsers to the installed Playwright version.
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
      # Pin the package mirror and bound dependency-installation attempts.
      - name: Pin apt mirror to archive.ubuntu.com
        run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
      - name: Install Playwright system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 420 pnpm exec playwright install-deps chromium-tip-of-tree; then
              exit 0
            fi
            echo "install-deps attempt $attempt timed out or failed; retrying"
          done
          exit 1
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium-tip-of-tree
      - name: End-to-end tests
        run: xvfb-run -a pnpm test:e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            test-results
            .output
          if-no-files-found: ignore
