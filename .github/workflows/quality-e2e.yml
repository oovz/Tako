name: Quality and E2E

# Reusable workflow that runs the build, lint, type-check, unit/integration
# tests, coverage check, and Playwright E2E tests. Called by:
#   - ci.yml        (on push to main and on pull_request)
#   - release.yml   (on tag push, to gate the release)
#   - live-e2e.yml  does NOT use this workflow; it runs its own live suite.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or SHA that every verification job must check out
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format check
        run: pnpm format:check
      - name: Verify generated site-integration registries are current
        run: pnpm check:site-integrations
      - name: Check architecture boundaries
        run: pnpm check:architecture
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit and integration tests with coverage check
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # Browser binaries are pinned to the resolved @playwright/test version,
      # so key the cache on that instead of the whole lockfile. Keying on the
      # lockfile busts the cache (and forces a full tip-of-tree re-download)
      # whenever any unrelated dependency changes.
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium-tip-of-tree
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium-tip-of-tree
      - name: End-to-end tests
        run: xvfb-run -a pnpm test:e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            test-results
            .output
          if-no-files-found: ignore
