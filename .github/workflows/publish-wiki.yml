name: Publish Wiki

# Publish wiki/ to GitHub Wiki after its first page has been created on GitHub.

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish-wiki:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish wiki
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if [[ ! -s wiki/Home.md ]]; then
            echo "::error::wiki/Home.md is missing or empty."
            exit 1
          fi

          repo="${GITHUB_REPOSITORY}"
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${repo}.wiki.git"

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          if ! git clone --depth 1 "$wiki_url" "$tmp_dir" 2>/dev/null; then
            echo "::error::Cannot access the wiki. Initialize it at https://github.com/${repo}/wiki and check the publishing token's access. Set WIKI_TOKEN when the workflow token cannot write to the wiki."
            exit 1
          fi

          # Remove all tracked files (keep .git) so deletions propagate.
          cd "$tmp_dir"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cd -

          # Copy current wiki content.
          cp -R wiki/. "$tmp_dir/"

          # Commit and push if there are changes.
          cd "$tmp_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore: sync wiki from ${{ github.sha }}"
          git push origin HEAD
