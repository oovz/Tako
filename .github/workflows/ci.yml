name: CI

# Verify branch pushes and pull requests with the shared quality workflow.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-e2e:
    uses: ./.github/workflows/quality-e2e.yml
    with:
      checkout_ref: ${{ github.sha }}
