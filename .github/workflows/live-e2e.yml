name: Live E2E

# Live end-to-end tests that hit real external APIs (MangaDex, Pixiv Comic,
# Shonen Jump+, manhuagui, comicnettai). These tests are inherently flaky
# because they depend on third-party service availability and rate limits.
#
# Runs on every push and PR alongside CI, but as a separate workflow so
# its result does not affect the CI run status or block releases. Tags are
# excluded to avoid a duplicate run when main and a tag are pushed together.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Live test scope
        required: true
        default: ci
        type: choice
        options:
          - ci
          - full

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium-tip-of-tree
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium-tip-of-tree
      - name: Bounded live API canary
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'ci'
        run: xvfb-run -a pnpm test:live:ci
      - name: Full live browser and download suite
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
        run: xvfb-run -a pnpm test:live:full
      - name: Upload live E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e-artifacts
          path: |
            test-results
            .output
          if-no-files-found: ignore
