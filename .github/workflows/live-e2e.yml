name: Live E2E

# Developers run the API canary or full live suite manually.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Live test scope
        required: true
        default: ci
        type: choice
        options:
          - ci
          - full

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # Match cached browsers to the installed Playwright version.
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-playwright-chromium-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 420 pnpm exec playwright install-deps chromium; then
              exit 0
            fi
            echo "install-deps attempt $attempt timed out or failed; retrying"
          done
          exit 1
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --no-shell chromium
      - name: Bounded live API canary
        if: inputs.suite == 'ci'
        run: pnpm test:live:ci
      - name: Full live browser and download suite
        if: inputs.suite == 'full'
        run: pnpm test:live:full
      - name: Upload live E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e-artifacts
          path: |
            test-results
            .output
          if-no-files-found: ignore
          retention-days: 7
