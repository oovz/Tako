name: Live E2E

# Live end-to-end tests that hit real external APIs (MangaDex, Pixiv Comic,
# Shonen Jump+, manhuagui, comicnettai). These tests are inherently flaky
# because they depend on third-party service availability and rate limits.
#
# Runs on every push and PR alongside CI, but as a separate workflow so
# its result does not affect the CI run status or block releases. Tags are
# excluded to avoid a duplicate run when main and a tag are pushed together.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Live test scope
        required: true
        default: ci
        type: choice
        options:
          - ci
          - full

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # Browser binaries are pinned to the resolved @playwright/test version,
      # so key the cache on that instead of the whole lockfile. Keying on the
      # lockfile busts the cache (and forces a full tip-of-tree re-download)
      # whenever any unrelated dependency changes.
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
      # The ubuntu-24.04 runner image routes apt through /etc/apt/apt-mirrors.txt,
      # whose azure.archive.ubuntu.com endpoint intermittently becomes
      # unreachable, leaving apt-get update (inside install-deps) hung with no
      # output for 20+ minutes. Pin the mirror to the reliable
      # archive.ubuntu.com and bound the step with a retry loop.
      - name: Pin apt mirror to archive.ubuntu.com
        run: sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
      - name: Install Playwright system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 420 pnpm exec playwright install-deps chromium-tip-of-tree; then
              exit 0
            fi
            echo "install-deps attempt $attempt timed out or failed; retrying"
          done
          exit 1
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium-tip-of-tree
      - name: Bounded live API canary
        if: github.event_name != 'workflow_dispatch' || inputs.suite == 'ci'
        run: xvfb-run -a pnpm test:live:ci
      - name: Full live browser and download suite
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
        run: xvfb-run -a pnpm test:live:full
      - name: Upload live E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e-artifacts
          path: |
            test-results
            .output
          if-no-files-found: ignore
